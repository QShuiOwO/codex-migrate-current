name: Build Ubuntu 24.04

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ubuntu-24.04-1.99.0
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Check formatting and Clippy
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --features gui -- -D warnings
      - name: Rust tests with synthetic data
        env:
          CODEX_MIGRATE_CODEX_BIN: ""
        run: cargo test --locked --all-targets --features gui
      - name: Build release binaries
        run: cargo build --locked --release --features gui --bins
      - name: Test unified release asset validation
        run: python3 tests/release_assets.py
      - name: Test native Desktop and CLI migration with isolated data
        run: |
          npm install --global @openai/codex@0.166.0
          python3 tests/current_runtime.py --codex-bin "$(command -v codex)" --migrate-bin target/release/codex-migrate
          python3 tests/cli_runtime.py --codex-bin "$(command -v codex)" --migrate-bin target/release/codex-migrate
          python3 tests/cli_tui.py --codex-bin "$(command -v codex)"
          CODEX_MIGRATE_CODEX_BIN="$(command -v codex)" cargo test --locked --features gui --bin codex-migrate-gui -- --ignored
      - name: Collect notices and package Ubuntu binaries
        run: |
          python3 scripts/generate-notices.py --target x86_64-unknown-linux-gnu --output dist/notices-linux
          python3 scripts/package-linux.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Codex-Migrate-Current-Ubuntu-24.04-x64
          path: |
            dist/release/*Ubuntu*.tar.gz
            dist/release/*Ubuntu*.sha256
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Codex-Migrate-Validation-Ubuntu-24.04-x64
          path: test-results/*-results.json
          if-no-files-found: ignore
          retention-days: 30
