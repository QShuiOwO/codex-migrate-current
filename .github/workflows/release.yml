name: Release Windows prerelease

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag (also choose this tag as the workflow ref)
        required: true
        type: string
      publish:
        description: Publish the reviewed draft as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the exact Cargo version tag
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $manifest = Get-Content -Raw Cargo.toml
          $version = [regex]::Match($manifest, '(?m)^version = "([^"]+)"').Groups[1].Value
          if (!$version -or $env:REQUESTED_TAG -ne "v$version") { throw 'Tag and Cargo version do not match.' }
          if ($env:GITHUB_REF -ne "refs/tags/$env:REQUESTED_TAG") { throw 'Run this workflow on the version tag.' }
  windows:
    needs: validate
    uses: ./.github/workflows/windows-build.yml
  release:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: Codex-Migrate-Current-Windows-x64
          path: artifacts
      - name: Create or update draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          PUBLISH: ${{ inputs.publish || false }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
            gh release upload "$RELEASE_TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --prerelease --latest=false \
              --title "Codex Migrate Current $RELEASE_TAG (Windows prerelease)" \
              --notes-file docs/release-notes-current.md
          fi
          if [ "$PUBLISH" = true ]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --draft=false --prerelease --latest=false
          fi
