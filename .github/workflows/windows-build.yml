name: Build Windows EXE

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      CODEX_MIGRATE_CODEX_BIN: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: windows-msvc-1.99.0
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --features gui -- -D warnings
      - name: Run Rust tests (synthetic legacy data; no native runtime)
        run: cargo test --locked --all-targets --features gui
      - name: Build release binaries
        run: cargo build --locked --release --features gui --bins --target x86_64-pc-windows-msvc
      - name: Collect dependency notices
        run: python scripts/generate-notices.py --target x86_64-pc-windows-msvc --output dist/notices
      - name: Package Windows binaries
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Codex-Migrate-Current-Windows-x64
          path: |
            dist/release/*.zip
            dist/release/*.sha256
          if-no-files-found: error
          retention-days: 30
