name: CI

on:
  push:
    branches: [main, chatgpt-compat]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows tests and package
    uses: ./.github/workflows/windows-build.yml
