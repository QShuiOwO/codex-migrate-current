name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Ubuntu 24.04 tests and package
    uses: ./.github/workflows/ubuntu-build.yml
  windows:
    name: Windows tests and package
    uses: ./.github/workflows/windows-build.yml
